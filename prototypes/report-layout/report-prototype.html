<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Layouts</title>
<!-- PROTOTYPE, throwaway: three layouts for the per-run HTML report, switchable via ?variant=A|B|C -->
<style>
  :root { --bg:#fafaf9; --panel:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4; --soft:#f5f5f4; --accent:#2563eb; --ok:#15803d; --no:#b91c1c; --warn:#a16207; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141414; --panel:#1d1d1d; --text:#e7e5e4; --muted:#a8a29e; --line:#303030; --soft:#262626; --accent:#60a5fa; --ok:#4ade80; --no:#f87171; --warn:#facc15; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, sans-serif; }
  a { color: var(--accent); }
  button, select, input { font: inherit; color: var(--text); }
  .muted { color: var(--muted); }
  .badge { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; padding:1px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
  .accepted { color: var(--ok); } .rejected { color: var(--no); } .unjudged { color: var(--warn); }
  .chip { display:inline-block; font-size:12px; padding:1px 8px; border-radius:6px; background:var(--soft); margin:0 4px 4px 0; }
  .desc p { margin: 0 0 8px; } .desc ul { margin: 0 0 8px; padding-left: 20px; }
  .btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* A: digest */
  .a-wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 96px; }
  .a-wrap h1 { font-size: 26px; margin: 0 0 4px; }
  .a-search { margin-top: 36px; border-top: 2px solid var(--text); padding-top: 12px; }
  .a-search h2 { font-size: 20px; margin: 0; font-family: ui-monospace, monospace; }
  .a-offer { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .a-offer h3 { margin: 0 0 2px; font-size: 17px; }
  .a-why { font-style: italic; margin: 6px 0; }
  .a-wrap details > summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .a-plain { white-space: pre-wrap; font-size: 14px; background: var(--soft); padding: 12px; border-radius: 6px; margin-top: 8px; }
  .a-rejected li { margin-bottom: 6px; }

  /* B: triage table */
  .b-wrap { padding: 20px 16px 96px; max-width: 1280px; margin: 0 auto; }
  .b-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .b-head h1 { font-size: 20px; margin: 0; }
  .b-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  .b-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .b-seg button { border: 0; background: var(--panel); padding: 5px 12px; cursor: pointer; }
  .b-seg button.on { background: var(--text); color: var(--bg); }
  .b-tools select, .b-tools input { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
  .b-tools input { min-width: 200px; flex: 1; }
  .b-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; position: sticky; top: 0; background: var(--panel); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.b-row { cursor: pointer; } tr.b-row:hover td { background: var(--soft); }
  tr.b-detail td { background: var(--soft); padding: 14px 18px; }
  .b-detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px; }
  @media (max-width: 720px) { .b-detail-grid { grid-template-columns: 1fr; } }
  .b-stack { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }

  /* C: inbox */
  .c-wrap { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: 100vh; }
  @media (max-width: 800px) { .c-wrap { grid-template-columns: 1fr; height: auto; } }
  .c-list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); padding-bottom: 80px; }
  .c-top { padding: 16px; border-bottom: 1px solid var(--line); }
  .c-top h1 { font-size: 17px; margin: 0; }
  .c-tabs { display: flex; border-bottom: 1px solid var(--line); }
  .c-tabs button { flex: 1; border: 0; background: none; padding: 10px 6px; cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; }
  .c-tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
  .c-item { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .c-item.on { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
  .c-item .t { font-weight: 600; font-size: 14px; }
  .c-item .s { font-size: 13px; color: var(--muted); }
  .c-pane { overflow-y: auto; padding: 28px 32px 96px; }
  @media (max-width: 800px) { .c-pane { padding: 20px 16px 96px; } }
  .c-pane h2 { margin: 0; font-size: 22px; }
  .c-actions { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .c-callout { border-left: 3px solid currentColor; padding: 8px 12px; background: var(--soft); border-radius: 0 6px 6px 0; margin-bottom: 16px; }
  .c-callout span { color: var(--text); }
  .c-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .c-fields section { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--panel); }
  .c-fields h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .c-fields dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 3px 10px; margin: 0; font-size: 14px; }
  .c-fields dt { color: var(--muted); } .c-fields dd { margin: 0; }

  /* prototype switcher: deliberately not part of any design */
  .proto-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: #111; color: #fff; padding: 6px 8px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 600 13px system-ui; z-index: 99; }
  .proto-bar button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; }
  .proto-bar span { min-width: 170px; text-align: center; }
</style>
</head>

<script>
const DATA = {"run":{"startedAt":"2026-09-23T17:42:00+02:00","model":"gpt-6-luna","tokens":{"input":30633,"output":2260},"costUsd":0.0042,"searches":[{"name":"java-warsaw","keywords":"Java Backend Developer","location":"Warsaw, Poland","postedWithin":"7d","profile":"Java development"},{"name":"software-engineer-warsaw","keywords":"Software Engineer","location":"Warsaw, Poland","postedWithin":"7d","profile":"Java development"}]},"offers":[{"id":"4292659542","search":"java-warsaw","alsoFoundBy":["software-engineer-warsaw"],"title":"Java Software Engineer","company":"Capital.com","location":"Warsaw, Mazowieckie, Poland","postedDate":"2026-09-22","url":"https://www.linkedin.com/jobs/view/4292659542","verdict":"accepted","reason":"The role’s main work is designing and building backend services in Java and Spring.","workMode":"hybrid","seniority":null,"techStack":["Java","Spring","SQL","Kafka","Kubernetes","CI/CD","JVM"],"salary":null,"employmentType":"Full-time","jobFunction":"Engineering and Information Technology","industries":"Financial Services","description":"We are a leading trading platform that is expanding to the four corners of the globe. Our top-rated products have won prestigious industry awards for their cutting-edge technology and seamless client experience. We deliver only the best, so we are always in search of the best people to join our ever-growing talent team.\n\nWe are currently growing our Backend Team and looking for great Engineers with an interest in trading to join us! Our Engineering team plays a pivotal role in ensuring the robustness, speed, and security of our product. Dedicated to enhancing performance, providing a best-in-class user experience, ensuring compliance, and safeguarding data, the team's efforts directly impact our ability to offer clients a seamless and secure trading journey.\n\nWe believe great engineering talent not only delivers excellent code, but also lives our values. We are looking for someone who is eager to go fast, willing to innovate and grow, who knows how to listen, respect and support, strives to exceed client expectations, and takes full ownership to achieve real results.\n\nCore responsibilities:\n\n- Design and build scalable, low-latency, and high-performance backend services\n\n- Develop distributed and asynchronous systems ensuring reliability and fault tolerance\n\n- Optimise performance across JVM, databases, caching, and networking layers\n\n- Apply security best practices in handling client PII and financial transactions\n\n- Use event-driven architectures and modern messaging solutions (e.g. Kafka)\n\n- Collaborate with cross-functional teams to align architecture with business needs\n\n- Maintain high code quality through testing, code reviews, and CI/CD practices\n\n- Leverage AI tools to accelerate development, testing, and delivery\n\nWhat you will need: Experience & domain knowledge:\n\n- Proven experience in FinTech, Banking, or related financial domains\n\n- Strong understanding of distributed systems architecture and the client-server model\n\n- Ability to design and maintain scalable, low-latency, high-performance systems\n\n- Solid knowledge of concurrency, multithreading, and asynchronous programming\n\n- Awareness of security best practices in handling PII and financial transactions\n\n- Basic understanding of network protocols and troubleshooting\n\n- Experience working in a product-led fast-paced environment as a team player\n\nTechnical skills:\n\n- Java and Spring: Advanced knowledge of Java Core technologies and the Spring framework\n\n- Data Mastery: Proficiency with SQL databases, ensuring optimal performance, structure, and replication\n\n- Concurrency & Async programming: advanced understanding and hands-on experience in asynchronous programming methods\n\n- Events streaming: Understanding of the event driven architecture (Kafka or similar solutions)\n\n- Operational Proficiency: Understanding and hands-on experience with Ops activities, Kubernetes, pipelines, Fit Flow and modern CI/CD patterns and strategies\n\n- AI tools: ability to effectively use AI technologies in engineering work e.g. applying AI for coding assistance, debugging, testing, documentation, and optimisation of workflows\n\nSoft skills:\n\n- Communication: Effective communication skills, especially with teams responsible for security, operations and product\n\n- Analytical thinking: Ability to tackle and investigate complicated problems and convert it to the task\n\n- Adaptability to Rapid Changes: Demonstrated capability to adjust to quick technological shifts and evolving business requirements\n\n- Ownership and Accountability: Readiness to take ownership of tasks, issues as well as demonstrate accountability of the results and outcome\n\nNice to have:\n\n- Performance: Knowledge of JVM performance optimization practices\n\n- No-SQL: Experience working with no-SQL databases is a big plus\n\n- In-memory storage: Strong knowledge of in-memory cache solutions\n\nWhat you will get in return:\n\n- Competitive salary and annual performance-based bonus\n\n- Generous annual leave policy\n\n- Health insurance and pension fund, with additional benefits depending on location\n\n- Hybrid working model (3 days from office) or fully remote across the country of employment\n\n- Workation policy (30 days remote from anywhere in the world)\n\n- Two additional paid days per year dedicated to volunteering\n\nWe may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us."},{"id":"4470920748","search":"java-warsaw","alsoFoundBy":[],"title":"Senior Backend Engineer (Java)","company":"Moniepoint Group","location":"Warsaw, Mazowieckie, Poland","postedDate":"2026-09-23","url":"https://www.linkedin.com/jobs/view/4470920748","verdict":"accepted","reason":"The role’s day-to-day work is building backend services with Java and Spring Boot.","workMode":null,"seniority":"senior","techStack":["Java","Spring Boot","Docker","Kubernetes","PostgreSQL","DynamoDB","Elasticsearch","AWS"],"salary":null,"employmentType":"Full-time","jobFunction":"Engineering","industries":"Financial Services","description":"Who we are\n\nMoniepoint Inc. is Africa’s all-in-one financial platform, helping 20 million businesses and individuals access seamless payments, banking, credit, cross-border, and business management tools each month.\n\nAs Nigeria’s largest merchant acquirer, we power most of the country’s point-of-sale (POS) transactions. Through our subsidiaries, Moniepoint Inc. processes over $250 billion in digital payment transaction value annually..\n\nAbout the role\n\nEngineering at Moniepoint is an inspired, customer-focused community dedicated to crafting solutions that redefine our industry. Our infrastructure runs on some of the cool tools that excite infrastructure engineers - Kubernetes, Docker, etc.\n\nWe also make business decisions based on the large stream of data we receive daily, so we work daily with big data, perform data analytics and build models to make sense of the noise and give our customers the best experience.\n\nCurious about what makes Moniepoint an incredible place to work? Check out posts on how we cultivate a culture of innovation, teamwork, and growth.\n\nWhat You'll Be Doing\n\n- Collaborate closely with cross-functional teams (Product, Design, and QA) to conceptualize, design, and deliver high-impact features.\n\n- Architect and build scalable, high-performance backend services using Java and Spring Boot.\n\n- Produce clean, maintainable, and well-documented code with a strong emphasis on reliability and testability.\n\n- Seamlessly integrate third-party services and APIs, ensuring robust error handling and graceful degradation.\n\n- Continuously enhance system performance and developer experience through thoughtful automation and refactoring.\n\n- Diagnose and resolve complex issues across the stack while proactively identifying opportunities for technical improvements.\n\n- Actively contribute to code reviews and architecture discussions, promoting engineering best practices across the team.\n\n- Maintain clear documentation of technical decisions, systems, and processes to support transparency and long-term scalability.\n\nWhat We're Looking For\n\n- Bachelor’s or Master’s degree in Computer Science, Engineering, or a related technical discipline.\n\n- 5+ years of hands-on professional experience in software engineering, with a strong emphasis on backend development.\n\n- Deep expertise in Java and Spring Boot, with a solid grasp of modern backend architecture and engineering best practices.\n\n- Proven experience designing, building, and scaling web services, RESTful APIs, and distributed systems.\n\n- Working knowledge of Agile development methodologies and CI/CD pipelines.\n\n- Strong proficiency with relational databases and ORM frameworks (e.g., Hibernate).\n\n- Exposure to frontend technologies such as AngularJS or React is a plus.\n\n- Excellent debugging and troubleshooting abilities, with a structured approach to problem-solving.\n\n- Strong communication skills and a collaborative, team-first mindset.\n\nOur Tech Stack\n\nAs part of our engineering team, you’ll work with modern technologies and tools that enable us to build scalable, reliable, and high-performing systems. Some of the technologies you’ll be hands-on with include\n\n- Java (latest versions): Powers our core backend systems with a strong emphasis on performance, scalability, and maintainability.\n\n- Spring & Spring Boot: Enables the development of modular, production-ready microservices with robust dependency management.\n\n- Docker & Kubernetes: Supports containerized deployments and orchestration, ensuring consistent and scalable environments across development, staging, and production.\n\n- PostgreSQL & DynamoDB: Leverages both relational and NoSQL databases to efficiently manage structured data and dynamic scaling requirements.\n\n- Elasticsearch: Delivers fast, flexible full-text search and real-time analytics across large datasets.\n\n- AWS Cloud Infrastructure: Facilitates cloud-native deployment and management of microservices designed for high availability and global scalability.\n\nWhat we can offer you\n\n- Culture - We put our people first and prioritize the well-being of every team member. We’ve built a company where all opinions carry weight and where all voices are heard. We value and respect each other and always look out for one another. Above all, we are human.\n\n- Learning - We have a learning and development-focused environment with an emphasis on knowledge sharing, training, and regular internal technical talks.\n\n- Compensation - You’ll receive an attractive salary, pension, health insurance, paid leave, plus other benefits.\n\nWhat to expect in the hiring process\n\nOur interview process is designed to be thoughtful, transparent, and candidate-friendly, allowing you to showcase your strengths while getting to know us better:\n\n- Initial Conversation: A brief introductory call with our recruiter to learn more about your background, career goals, and to share insights about the role and our team.\n\n- Technical Assessment: A practical, take-home coding exercise that reflects real-world challenges. You'll have ample time to complete this in your own environment\n\n- Deep Dive Technical Interview: A focused session with our Engineering Team, where we'll explore system design, architecture, and problem-solving approaches.\n\n- Final Interview: A combined technical and behavioural conversation with a member of our Executive Team, aimed at understanding your alignment with our values, vision, and culture\n\nMoniepoint is an equal opportunity employer. We celebrate diversity and are committed to creating an inclusive environment for all employees and candidates."},{"id":"4458683273","search":"java-warsaw","alsoFoundBy":[],"title":"Middle/Senior Java Developer","company":"Veeam Software","location":"Warsaw, Mazowieckie, Poland","postedDate":"2026-09-18","url":"https://www.linkedin.com/jobs/view/4458683273","verdict":"accepted","reason":"The role’s core work is implementing and developing Java product functionality.","workMode":"hybrid","seniority":"senior","techStack":["Java 21","Kotlin","SpringBoot","Gradle","Maven","PostgreSQL","Hibernate"],"salary":"SYNTHETIC 22,000 - 28,000 PLN/month","employmentType":"Full-time","jobFunction":"Engineering and Information Technology","industries":"Software Development","description":"Veeam is the Data and AI Trust Company, specializing in helping organizations ensure their data and AI are fully understood, secured, and resilient to enable the acceleration of safe AI at scale. As the market leader in both data resilience and data security posture management, Veeam is built for the convergence of identity, data, security, and AI risk. Headquartered in Seattle with offices in more than 30 countries, Veeam protects over 550,000 customers worldwide, who trust Veeam to keep their businesses running. Join us as we go fearlessly forward together, growing, learning, and making a real impact for some of the world’s biggest brands.\n\nNow we are looking for a Middle/Senior Java Developer to join the team that works on the Veeam Backup for Salesforce.\n\nAbout The Role\n\nJoin us as a Java Developer and help shape the Veeam Backup for Salesforce, enhancing data protection and driving business resilience.\n\nWhat You’ll Do\n\n- Participating in product architecture development\n\n- Implementing product functionality\n\n- Solving any technical problems in the product being developed\n\nTechnologies You’ll Work With\n\n- Java 21, Kotlin, SpringBoot, Gradle, Maven, PostgreSQL, Hibernate\n\nWhat You’ll Bring\n\n- 3+ years of experience developing Java applications\n\n- Experience with development on the Salesforce platform\n\n- Excellent knowledge of Core Java and Spring\n\n- The ability to apply design patterns in practice\n\n- Experience developing REST services\n\n- English proficiency for daily communication within international teams\n\nBonus Skills\n\n- Experience with Kubernetes (K8s)\n\n- Experience with Azure Cloud Services\n\n- Experience with PostgreSQL\n\nWhat You'll Get\n\n- 26 paid days off annually, plus 4 extra global VeeaMe Days for self-care and 24 paid volunteer hours annually through Veeam Cares\n\n- Paid parental, maternity, and paternity leave\n\n- Fully covered family medical plan, dental, rehab, and vaccinations\n\n- Life, critical illness, and disability insurance\n\n- Employer pension contribution via PPK\n\n- Monthly Edenred allowance of 450 PLN for meals\n\n- MultiSport card fully covered by Veeam, giving access to sports facilities nationwide\n\n- Up to 12 free therapy sessions annually, plus legal and financial advice\n\n- Opportunities to learn and grow through on-demand libraries (LinkedIn Learning, O’Reilly), mentoring, workshops and learning events like our annual Global Day of Learning\n\n#Hybrid\n\nVeeam Software is an equal opportunity employer and does not tolerate discrimination in any form on the basis of race, color, religion, gender, age, national origin, citizenship, disability, veteran status or any other classification protected by federal, state or local law. All your information will be kept confidential.\n\nPersonal data collected during the recruitment process will be processed in accordance with our Recruiting Privacy Notice, which explains how your information is collected, used, and handled in connection with hiring activities. By applying for this position, you consent to this processing.\n\nBy submitting your application, you confirm that the information provided, including any supporting documents, is complete and accurate to the best of your knowledge. Any misrepresentation, omission, or falsification may result in disqualification from consideration or, if discovered after employment begins, termination of employment."},{"id":"4470403832","search":"java-warsaw","alsoFoundBy":[],"title":"(Senior) Software Engineer with Java","company":"Aviva","location":"Warsaw, Mazowieckie, Poland","postedDate":"2026-09-22","url":"https://www.linkedin.com/jobs/view/4470403832","verdict":"accepted","reason":"The role’s main day-to-day work is building Java and Spring Boot microservices and APIs.","workMode":"hybrid","seniority":"senior","techStack":["Java","Spring Boot","Python","Kafka/MSK","AWS ECS","S3","Aurora/PostgreSQL","API Gateway"],"salary":null,"employmentType":"Full-time","jobFunction":"Information Technology","industries":"Insurance","description":"Hi, we're glad you're here! We are hiring to our Aviva Services Excellence Centre! Take a look at our job description - maybe it suits you or one of your friends? \n\nAs a (Senior) Software Engineer you will be is responsible for building and supporting high-performance microservices and APIs that provide secure access to enterprise operational data. Working within a cloud-native architecture, you will develop containerised services using Spring Boot and Python, enabling real-time integration between business systems and the ODS platform.\nYou will play a key role in implementing modern API-led and event-driven integration patterns, helping to establish reusable services and standards that support enterprise-wide data consumption.\n\nWhat will you be doing?\n\n- Designing, developing and maintaining RESTful APIs, microservices and integration services.\n\n- Building containerised applications using Spring Boot and/or Python.\n\n- Developing secure, scalable and resilient API solutions supporting (ODS) Operational Data Store access and integration.\n\n- Building event-driven services and integration // ---------- Variant B: Triage table (one sortable, filterable table across all searches) ----------
function VariantB(root) {
  const st = { verdict: "accepted", search: "", mode: "", q: "", sort: "postedDate", dir: -1, open: new Set() };
  const cols = [
    ["postedDate", "Posted"], ["title", "Title"], ["company", "Company"], ["search", "Search"],
    ["workMode", "Mode"], ["seniority", "Seniority"], ["salary", "Salary"], ["techStack", "Stack"], ["verdict", "Verdict"],
  ];
  const body = el("div");
  root.append(el("div", { class: "b-wrap" },
    el("div", { class: "b-head" }, el("h1", {}, `Job offers, ${when}`), el("span", { class: "muted" }, summary)),
    body,
  ));
  function draw() {
    const rows = offers
      .filter((o) => !st.verdict || o.verdict === st.verdict)
      .filter((o) => !st.search || o.search === st.search)
      .filter((o) => !st.mode || (st.mode === "none" ? !o.workMode : o.workMode === st.mode))
      .filter((o) => !st.q || JSON.stringify([o.title, o.company, o.techStack, o.description]).toLowerCase().includes(st.q.toLowerCase()))
      .sort((a, b) => st.dir * String(a[st.sort] ?? "").localeCompare(String(b[st.sort] ?? "")));
    const seg = el("div", { class: "b-seg" }, [["", "All"], ["accepted", "Accepted"], ["rejected", "Rejected"], ["unjudged", "Unjudged"]]
      .map(([v, label]) => el("button", { class: st.verdict === v ? "on" : "", onclick: () => { st.verdict = v; draw(); } }, `${label} ${v ? count(v) : offers.length}`)));
    const searchSel = el("select", { onchange: (e) => { st.search = e.target.value; draw(); } },
      el("option", { value: "" }, "All searches"), run.searches.map((s) => el("option", { value: s.name, selected: st.search === s.name }, s.name)));
    const modeSel = el("select", { onchange: (e) => { st.mode = e.target.value; draw(); } },
      [["", "Any work mode"], ["remote", "remote"], ["hybrid", "hybrid"], ["on-site", "on-site"], ["none", "not stated"]]
        .map(([v, l]) => el("option", { value: v, selected: st.mode === v }, l)));
    const q = el("input", { type: "text", placeholder: "Filter by title, company, stack, text…", value: st.q });
    q.oninput = () => { st.q = q.value; draw(); const again = body.querySelector("input"); again.focus(); again.setSelectionRange(st.q.length, st.q.length); };
    const table = el("table", {},
      el("thead", {}, el("tr", {}, cols.map(([k, label]) => el("th", { onclick: () => { st.dir = st.sort === k ? -st.dir : 1; st.sort = k; draw(); } },
        label + (st.sort === k ? (st.dir === 1 ? " ▲" : " ▼") : ""))))),
      el("tbody", {}, rows.flatMap((o) => {
        const row = el("tr", { class: "b-row", onclick: () => { st.open.has(o.id) ? st.open.delete(o.id) : st.open.add(o.id); draw(); } },
          el("td", { class: "muted" }, o.postedDate ?? ""), el("td", {}, el("b", {}, o.title)), el("td", {}, o.company),
          el("td", { class: "muted" }, o.search), el("td", {}, o.workMode ?? "–"), el("td", {}, o.seniority ?? "–"),
          el("td", {}, o.salary ?? "–"), el("td", {}, el("div", { class: "b-stack", title: o.techStack.join(", ") }, o.techStack.join(", "))),
          el("td", {}, badge(o.verdict)));
        if (!st.open.has(o.id)) return [row];
        const copyBtn = el("button", { class: "btn", onclick: (e) => { e.stopPropagation(); copy(o.description, copyBtn); } }, "Copy description");
        const detail = el("tr", { class: "b-detail" }, el("td", { colspan: cols.length },
          el("div", { class: "b-detail-grid" },
            el("div", {},
              el("p", { style: "margin-top:0" }, badge(o.verdict), " ", o.reason),
              el("div", { class: "muted" }, o.location),
              el("div", {}, [o.employmentType, o.jobFunction, o.industries].filter(Boolean).map((x) => el("span", { class: "chip" }, x))),
              o.alsoFoundBy.length ? el("div", { class: "muted" }, `Also found by: ${o.alsoFoundBy.join(", ")}`) : null,
              el("div", { class: "c-actions" }, el("a", { class: "btn primary", href: o.url, target: "_blank", rel: "noopener" }, "Open on LinkedIn"), copyBtn),
            ),
            richDescription(o.description),
          )));
        return [row, detail];
      })),
    );
    body.replaceChildren(
      el("div", { class: "b-tools" }, seg, searchSel, modeSel, q),
      el("div", { class: "muted", style: "margin-bottom:6px;font-size:13px" }, `Showing ${rows.length} of ${offers.length} · click a row to expand · click a header to sort`),
      el("div", { class: "b-scroll" }, table),
    );
  }
  draw();
}

// ---------- Variant C: Inbox (list on the left, reading pane on the right) ----------
function VariantC(root) {
  const st = { tab: "accepted", sel: null };
  const list = el("div", { class: "c-list" });
  const pane = el("div", { class: "c-pane" });
  root.append(el("div", { class: "c-wrap" }, list, pane));
  const current = () => offers.filter((o) => o.verdict === st.tab);
  function draw() {
    const items = current();
    if (!items.some((o) => o.id === st.sel)) st.sel = items[0]?.id ?? null;
    list.replaceChildren(
      el("div", { class: "c-top" }, el("h1", {}, `Job offers, ${when}`), el("div", { class: "muted", style: "font-size:13px" }, summary),
        el("div", { class: "muted", style: "font-size:12px;margin-top:4px" }, "j / k to move through the list")),
      el("div", { class: "c-tabs" }, ["accepted", "rejected", "unjudged"].map((t) =>
        el("button", { class: st.tab === t ? "on" : "", onclick: () => { st.tab = t; st.sel = null; draw(); } }, `${t[0].toUpperCase() + t.slice(1)} ${count(t)}`))),
      items.map((o) => el("div", { class: `c-item ${o.id === st.sel ? "on" : ""}`, onclick: () => { st.sel = o.id; draw(); } },
        el("div", { class: "t" }, o.title),
        el("div", { class: "s" }, [o.company, o.workMode, o.postedDate].filter(Boolean).join(" · ")),
        el("div", { class: "s" }, o.search),
      )),
    );
    const o = offers.find((x) => x.id === st.sel);
    if (!o) { pane.replaceChildren(el("p", { class: "muted" }, "Nothing here.")); return; }
    const copyBtn = el("button", { class: "btn", onclick: () => copy(o.description, copyBtn) }, "Copy description");
    const dl = (pairs) => el("dl", {}, pairs.flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v || "–")]));
    pane.replaceChildren(
      el("h2", {}, o.title),
      el("div", { class: "muted" }, `${o.company} · ${o.location}`),
      el("div", { class: "c-actions" }, el("a", { class: "btn primary", href: o.url, target: "_blank", rel: "noopener" }, "Open on LinkedIn"), copyBtn),
      el("div", { class: `c-callout ${o.verdict}` }, badge(o.verdict), " ", el("span", {}, o.reason)),
      el("div", { class: "c-fields" },
        el("section", {}, el("h4", {}, "From LinkedIn"), dl([["Posted", o.postedDate], ["Salary", o.salary], ["Employment", o.employmentType], ["Function", o.jobFunction], ["Industries", o.industries]])),
        el("section", {}, el("h4", {}, "Judged by the model"), dl([["Work mode", o.workMode], ["Seniority", o.seniority], ["Stack", o.techStack.join(", ")]])),
        el("section", {}, el("h4", {}, "Found by"), dl([["Search", o.search], ["Profile", searchByName[o.search].profile], ["Also found by", o.alsoFoundBy.join(", ")]])),
      ),
      richDescription(o.description),
    );
    pane.scrollTop = 0;
  }
  document.onkeydown = (e) => {
    if (currentKey() !== "C" || e.target.closest("input, textarea, select, [contenteditable]")) return;
    if (e.key !== "j" && e.key !== "k") return;
    const items = current(); const i = items.findIndex((o) => o.id === st.sel);
    const next = items[Math.min(items.length - 1, Math.max(0, i + (e.key === "j" ? 1 : -1)))];
    if (next) { st.sel = next.id; draw(); list.querySelector(".c-item.on")?.scrollIntoView({ block: "nearest" }); }
  };
  draw();
}

// ---------- Prototype switcher ----------
const VARIANTS = [["A", "Digest", VariantA], ["B", "Triage table", VariantB], ["C", "Inbox", VariantC]];
function currentKey() { const v = new URLSearchParams(location.search).get("variant"); return VARIANTS.some(([k]) => k === v) ? v : "A"; }
function show(key) {
  const url = new URL(location.href); url.searchParams.set("variant", key); history.replaceState(null, "", url);
  const [k, name, render] = VARIANTS.find(([k]) => k === key);
  document.getElementById("label").textContent = `${k} (${name})`;
  document.onkeydown = null;
  const app = document.getElementById("app"); app.replaceChildren(); render(app); window.scrollTo(0, 0);
}
function step(d) { const i = VARIANTS.findIndex(([k]) => k === currentKey()); show(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]); }
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
window.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});
show(currentKey());
</script>
